name: GaelicCompanion
options:
  bundleIdPrefix: com.dalemyers
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  GaelicCompanion:
    type: application
    platform: iOS
    sources:
      - path: Companion
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dalemyers.GaelicCompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Unofficial Companion to 'Scottish Gaelic In 12 Weeks'"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  GaelicCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CompanionTests]
    dependencies:
      - target: GaelicCompanion
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GaelicCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CompanionUITests]
    dependencies:
      - target: GaelicCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GaelicCompanion:
    build:
      targets:
        GaelicCompanion: all
    test:
      targets: [GaelicCompanionTests, GaelicCompanionUITests]
      gatherCoverageData: true
