name: GaelicCompanion
options:
  bundleIdPrefix: io.myers
  settingPresets: none
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    SDKROOT: iphoneos
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: "0"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  GaelicIntroEditor:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IntroEditor
      - path: Companion/Catalog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.myers.GaelicIntroEditor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gaelic Intro Editor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        SDKROOT: macosx
        TARGETED_DEVICE_FAMILY: ""
  GaelicIntroEditorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [IntroEditorTests]
    dependencies:
      - target: GaelicIntroEditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        SDKROOT: macosx
        TARGETED_DEVICE_FAMILY: ""
  GaelicIntroEditorUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IntroEditorUITests
      - path: IntroEditorTests/Fixtures/synthetic.mp3
        buildPhase: resources
    dependencies:
      - target: GaelicIntroEditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: macosx
        TARGETED_DEVICE_FAMILY: ""
  GaelicCompanion:
    type: application
    platform: iOS
    sources:
      - path: Companion
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.myers.GaelicCompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Companion/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Unofficial Gaelic Companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  GaelicCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CompanionTests]
    dependencies:
      - target: GaelicCompanion
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
  GaelicCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CompanionUITests]
    dependencies:
      - target: GaelicCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GaelicIntroEditor:
    build:
      targets:
        GaelicIntroEditor: all
    test:
      targets: [GaelicIntroEditorTests, GaelicIntroEditorUITests]
  GaelicCompanion:
    build:
      targets:
        GaelicCompanion: all
    test:
      targets: [GaelicCompanionTests, GaelicCompanionUITests]
      gatherCoverageData: true
